services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      postgres18:
        condition: service_healthy
      redis:
        condition: service_healthy
      rustfs:
        condition: service_healthy
    environment:
      RAILS_ENV: production
      DATABASE_URL: postgres://postgres:postgres@postgres18:5432/grey_repo_production
      REDIS_URL: redis://redis:6379
      REDIS_CACHE_URL: redis://redis:6379/0
      REDIS_SIDEKIQ_URL: redis://redis:6379/1
      SECRET_KEY_BASE: 3e363bcd52e247b738b276c17af3d7f467db6af0ac9b7416e64fce3fbb34599163dc5149ce316c0770438e82f2858112788dd47bf81170893f023042119642da
      RAILS_SERVE_STATIC_FILES: "true"
      RAILS_LOG_TO_STDOUT: "true"
      DB_POOL: 5
      ACTIVE_STORAGE_SERVICE: minio
      MINIO_ENDPOINT: http://rustfs:9000
      MINIO_ACCESS_KEY: minioaccess
      MINIO_SECRET_KEY: miniosecret
      APP_HOST: localhost:3000
      SMTP_ADDRESS: mailpit
      SMTP_PORT: 1025
      SMTP_DOMAIN: greyrepo.xyz
      SMTP_STARTTLS: "false"
    volumes:
      - rails_storage:/rails/storage
    restart: unless-stopped

  sidekiq:
    build:
      context: .
      dockerfile: Dockerfile
    command: bundle exec sidekiq -C config/sidekiq.yml
    depends_on:
      postgres18:
        condition: service_healthy
      redis:
        condition: service_healthy
      rustfs:
        condition: service_healthy
    environment:
      RAILS_ENV: production
      DATABASE_URL: postgres://postgres:postgres@postgres18:5432/grey_repo_production
      REDIS_URL: redis://redis:6379
      REDIS_CACHE_URL: redis://redis:6379/0
      REDIS_SIDEKIQ_URL: redis://redis:6379/1
      SECRET_KEY_BASE: 3e363bcd52e247b738b276c17af3d7f467db6af0ac9b7416e64fce3fbb34599163dc5149ce316c0770438e82f2858112788dd47bf81170893f023042119642da
      DB_POOL: 5
      ACTIVE_STORAGE_SERVICE: minio
      MINIO_ENDPOINT: http://rustfs:9000
      MINIO_ACCESS_KEY: minioaccess
      MINIO_SECRET_KEY: miniosecret
      APP_HOST: localhost:3000
      SMTP_ADDRESS: mailpit
      SMTP_PORT: 1025
      SMTP_DOMAIN: greyrepo.xyz
      SMTP_STARTTLS: "false"
    volumes:
      - rails_storage:/rails/storage
    restart: unless-stopped

  postgres18:
    image: postgres:18.4-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: grey_repo_production
      PGDATA: /var/lib/postgresql/data/pgdata
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"
      - "1025:1025"
    restart: unless-stopped

  rustfs:
    image: rustfs/rustfs:1.0.0-beta.8-glibc
    command: ["/data"]
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      RUSTFS_ACCESS_KEY: minioaccess
      RUSTFS_SECRET_KEY: miniosecret
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_REGION: us-east-1
    volumes:
      - rustfs_data:/data
      - rustfs_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "curl --silent --output /dev/null http://127.0.0.1:9000"]
      interval: 5s
      timeout: 3s
      retries: 6
    restart: unless-stopped

  createbucket:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      rustfs:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set rustfs http://rustfs:9000 minioaccess miniosecret;
      mc mb --ignore-existing rustfs/greyhackbucket;
      mc anonymous set public rustfs/greyhackbucket;
      exit 0;
      "

volumes:
  postgres_data:
  redis_data:
  rails_storage:
  rustfs_data:
  rustfs_logs:
