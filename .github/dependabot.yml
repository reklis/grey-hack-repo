version: 2
updates:
  - package-ecosystem: bundler
    directory: /
    schedule:
      interval: daily
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /e2e
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directories:
      - /
      - /docker
      - /.devcontainer
    schedule:
      interval: weekly
  - package-ecosystem: docker-compose
    directories:
      - /
      - /.devcontainer
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
