name: CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Ruby and gems
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Run StandardRB
        run: bundle exec standardrb

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:14-alpine
        ports:
          - "5432:5432"
        env:
          POSTGRES_DB: greyrepo_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - "6379:6379"
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      mailpit:
        image: axllent/mailpit:latest
        ports:
          - "8025:8025"
          - "1025:1025"

    env:
      RAILS_ENV: test
      DISABLE_SPRING: "1"
      DATABASE_URL: "postgres://postgres:password@localhost:5432/greyrepo_test"
      REDIS_URL: "redis://localhost:6379"
      REDIS_CACHE_URL: "redis://localhost:6379/0"
      REDIS_SIDEKIQ_URL: "redis://localhost:6379/1"
      SECRET_KEY_BASE: "test_secret_key_base_for_ci_testing_only"
      RAILS_SERVE_STATIC_FILES: "true"
      RAILS_LOG_TO_STDOUT: "true"
      DB_POOL: "5"
      APP_HOST: "localhost:3000"
      ACTIVE_STORAGE_SERVICE: "minio"
      MINIO_ENDPOINT: "http://localhost:9000"
      SMTP_ADDRESS: "localhost"
      SMTP_PORT: "1025"
      SMTP_DOMAIN: "greyrepo.xyz"
      SMTP_STARTTLS: "false"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download wordlist
        run: |
          mkdir -p wordlists
          curl -L -o wordlists/precomputed_hashes.txt "https://greyhackrepo.us-iad-10.linodeobjects.com/wordlists%2Fprecomputed_hashes.txt"

      - name: Install Ruby and gems
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          cache: 'yarn'
          cache-dependency-path: 'yarn.lock'

      - name: Install root Node dependencies
        run: yarn install --frozen-lockfile

      - name: Start RustFS
        run: |
          docker run -d --name rustfs \
            -p 9000:9000 -p 9001:9001 \
            -e RUSTFS_ACCESS_KEY=minioaccess \
            -e RUSTFS_SECRET_KEY=miniosecret \
            -e RUSTFS_REGION=us-east-1 \
            rustfs/rustfs:1.0.0-beta.8-glibc /data
          for i in {1..60}; do
            if curl -s --max-time 2 -o /dev/null http://localhost:9000; then
              exit 0
            fi
            echo "Waiting for RustFS..."
            sleep 2
          done
          docker logs rustfs
          exit 1

      - name: Setup S3 bucket
        run: |
          docker run --rm --network host --entrypoint sh \
            -e AWS_ACCESS_KEY_ID=minioaccess \
            -e AWS_SECRET_ACCESS_KEY=miniosecret \
            -e AWS_DEFAULT_REGION=us-east-1 \
            amazon/aws-cli:2.37.13 -ec '
              aws --endpoint-url=http://localhost:9000 s3 mb s3://greyhackbucket
              aws --endpoint-url=http://localhost:9000 s3api put-bucket-policy \
                --bucket greyhackbucket \
                --policy '\''{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Principal":"*","Action":"s3:GetObject","Resource":"arn:aws:s3:::greyhackbucket/*"}]}'\''
            '

      - name: Set up database
        run: |
          bin/rails db:prepare
          bin/rails db:migrate

      - name: Build assets
        run: bundle exec rails assets:precompile

      - name: Install Playwright dependencies
        working-directory: e2e
        run: |
          yarn install --frozen-lockfile
          yarn playwright install --with-deps chromium

      - name: Start Sidekiq
        run: |
          bundle exec sidekiq -C config/sidekiq.yml &
          sleep 5

      - name: Start Rails server
        run: |
          bundle exec rails server -p 3000 -d -e test
          sleep 10

      - name: Wait for server to be ready
        run: |
          for i in {1..30}; do
            curl -s http://localhost:3000 > /dev/null && break
            echo "Waiting for server..."
            sleep 2
          done
          curl -s http://localhost:3000 > /dev/null || exit 1

      - name: Run Playwright tests
        working-directory: e2e
        run: npx playwright test --project=chromium
        env:
          BASE_URL: http://localhost:3000
          CI: true

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 30

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-test-results
          path: |
            e2e/test-results/
          retention-days: 7

      - name: Stop Rails server, Sidekiq, and RustFS
        if: always()
        run: |
          pkill -f "rails server" || true
          pkill -f "sidekiq" || true
          docker stop rustfs || true
          docker rm rustfs || true

  build:
    needs: [lint, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          pull: true
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Check production boot and autoloading
        run: |
          docker run --rm --entrypoint bundle \
            -e SECRET_KEY_BASE=security-build-check -e ACTIVE_STORAGE_SERVICE=local \
            "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest" exec rails zeitwerk:check
          docker run --rm --entrypoint bundle \
            "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest" exec ruby -rresolv \
            -e 'abort "Unpatched resolver" unless Gem.loaded_specs.fetch("resolv").version >= Gem::Version.new("0.7.2")'

      - name: Reject fixable image vulnerabilities before publishing
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD:/reports" \
            aquasec/trivy:0.75.0 image \
            --image-src docker --scanners vuln \
            --format json --output /reports/trivy.json \
            "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"
          jq -e '[.Results[]?.Vulnerabilities[]? | select((.FixedVersion // "") != "")] | length == 0' trivy.json

      - name: Upload vulnerability report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: image-vulnerabilities
          path: trivy.json

      - name: Push scanned Docker image
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          while IFS= read -r tag; do
            docker push "$tag"
          done <<< "$IMAGE_TAGS"
